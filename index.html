<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Грани — конструктор по стереометрии</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <aside class="side left">
    <header class="brand">
      <h1>Грани</h1>
      <p>конструктор по стереометрии</p>
    </header>
    <section>
      <select id="examples" aria-label="Примеры задач"></select>
      <div class="filebar">
        <button id="save-file" title="Сохранить задачу в файл">Сохранить</button>
        <button id="open-file" title="Открыть сохранённую задачу">Открыть</button>
        <button id="copy-link" title="Скопировать ссылку на эту задачу">Ссылка</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
    <section>
      <h2>Фигура</h2>
      <div id="figure"></div>
      <div id="figure-info"></div>
    </section>
    <section>
      <h2>Построения</h2>
      <div id="tools"></div>
    </section>
  </aside>

  <main class="stage">
    <div id="hint" class="hint" hidden></div>
    <svg id="view" role="img" aria-label="Чертёж фигуры"></svg>
    <div class="viewbar">
      <label title="Насколько плотно закрашены грани">Грани
        <input id="alpha" type="range" min="0" max="0.9" step="0.02">
      </label>
      <label><input id="hidden" type="checkbox"> невидимые линии</label>
      <label><input id="labels" type="checkbox"> подписи</label>
      <button id="home">Исходный вид</button>
      <button id="show-net">Развёртка</button>
      <button id="export-svg" title="Сохранить чертёж как картинку SVG">Картинка</button>
      <span class="fine">тяните — вращение, колесо — масштаб</span>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <aside class="side right">
    <header class="row">
      <h2>Результаты</h2>
      <button id="undo" title="Ctrl+Z">Отменить</button>
      <button id="clear">Очистить</button>
    </header>
    <div id="results"></div>
  </aside>

  <dialog id="net" aria-labelledby="net-title">
    <header class="row">
      <h2 id="net-title">Развёртка поверхности</h2>
      <button id="net-close">Закрыть</button>
    </header>
    <div id="net-body"></div>
  </dialog>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
