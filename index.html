<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Грани — конструктор по стереометрии</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <aside class="side left">
    <header class="brand row">
      <div>
        <h1>Грани</h1>
        <p>конструктор по стереометрии</p>
      </div>
      <button id="feedback" class="feedback" title="Сообщить о баге или предложить улучшение">Баг / идея</button>
    </header>
    <section>
      <select id="examples" aria-label="Примеры задач"></select>
      <div class="filebar">
        <button id="save-file" title="Сохранить задачу в файл">Сохранить</button>
        <button id="open-file" title="Открыть сохранённую задачу">Открыть</button>
        <button id="copy-link" title="Скопировать ссылку на эту задачу">Ссылка</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
    <section>
      <h2>Фигура</h2>
      <div id="figure"></div>
      <div id="figure-info"></div>
    </section>
    <section>
      <h2>Построения</h2>
      <div id="tools"></div>
    </section>
  </aside>

  <main class="stage">
    <div id="hint" class="hint" hidden></div>
    <svg id="view" role="img" aria-label="Чертёж фигуры"></svg>
    <div class="viewbar">
      <label title="Насколько плотно закрашены грани">Грани
        <input id="alpha" type="range" min="0" max="0.9" step="0.02">
      </label>
      <label><input id="hidden" type="checkbox"> невидимые линии</label>
      <label><input id="labels" type="checkbox"> подписи</label>
      <button id="home">Исходный вид</button>
      <button id="show-net">Развёртка</button>
      <button id="export-svg" title="Сохранить чертёж как картинку SVG">Картинка</button>
      <span class="fine">тяните — вращение, колесо — масштаб</span>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <aside class="side right">
    <header class="row">
      <h2>Результаты</h2>
      <button id="undo" title="Ctrl+Z">Отменить</button>
      <button id="clear">Очистить</button>
    </header>
    <div id="results"></div>
  </aside>

  <dialog id="net" aria-labelledby="net-title">
    <header class="row">
      <h2 id="net-title">Развёртка поверхности</h2>
      <button id="net-close">Закрыть</button>
    </header>
    <div id="net-body"></div>
  </dialog>

  <dialog id="fb" aria-labelledby="fb-title">
    <form id="fb-form" method="dialog">
      <header class="row">
        <h2 id="fb-title">Баг или идея</h2>
        <button type="button" id="fb-close">Закрыть</button>
      </header>
      <fieldset class="fb-kind">
        <legend class="fine">Что это</legend>
        <label><input type="radio" name="fb-kind" value="bug" checked> Баг — что-то работает не так</label>
        <label><input type="radio" name="fb-kind" value="idea"> Улучшение — идея, чего не хватает</label>
      </fieldset>
      <label class="field"><span>Коротко</span><input id="fb-summary" required maxlength="120" autocomplete="off" placeholder="Например: не решается задача с HA и HC"></label>
      <label class="field"><span>Подробнее</span><textarea id="fb-details" rows="6" placeholder="Что делали, что ожидали и что получилось — или как должно работать"></textarea></label>
      <label class="fb-check"><input type="checkbox" id="fb-attach" checked> Приложить ссылку на текущую задачу (фигура, построения и условия)</label>
      <p class="fine">Откроется страница GitHub с уже заполненным сообщением — останется нажать «Create». Нужен аккаунт GitHub; сообщение будет видно всем.</p>
      <div class="row"><button type="submit" class="primary">Открыть на GitHub</button></div>
    </form>
  </dialog>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
